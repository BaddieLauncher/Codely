<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Codely OS v17.0 | Zak Studio Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono&display=swap');
        :root { --bg-deep: #000000; --accent: #4285f4; --border: rgba(255,255,255,0.1); }
        body { font-family: 'Google Sans', sans-serif; background: var(--bg-deep); color: #fff; margin: 0; overflow: hidden; height: 100dvh; }
        #splash-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.8s; }
        .gemini-gradient { background: linear-gradient(70deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .desktop-shell { display: flex; height: 100dvh; width: 100vw; position: relative; }
        .side-dock { width: 320px; background: #090909; border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.4s ease; z-index: 1000; }
        @media (max-width: 1024px) { .side-dock { position: absolute; left: -320px; height: 100%; } .side-dock.active { left: 0; box-shadow: 10px 0 50px rgba(0,0,0,0.9); } }
        .history-container { flex: 1; overflow-y: auto; padding: 10px; }
        .editor-surface { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .mega-input-container { max-width: 900px; margin: 0 auto; background: #161616; border-radius: 24px; padding: 15px; border: 1px solid var(--border); transition: 0.3s; }
        textarea { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 16px; resize: none; min-height: 120px; font-family: 'JetBrains Mono', monospace; }
        #render-view { position: fixed; inset: 0; background: #fff; z-index: 5000; display: none; }
        .preview-action-bar { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #111; padding: 8px 25px; border-radius: 50px; display: flex; gap: 15px; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.7); z-index: 6001; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 6000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-content { background: #111; width: 90%; max-width: 450px; padding: 40px; border-radius: 35px; border: 1px solid #333; position: relative; }
        .lang-btn { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; border: 1px solid #333; transition: 0.2s; color: #666; }
        .lang-btn.active { border-color: var(--accent); color: white; background: rgba(66, 133, 244, 0.1); }
        .toggle-btn { font-size: 10px; font-weight: bold; padding: 4px 10px; border-radius: 20px; border: 1px solid #444; color: #888; }
        .toggle-btn.active { background: white; color: black; border-color: white; }
        .loading-dots:after { content: '.'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1 class="text-4xl font-bold gemini-gradient">Codely OS v17.0</h1>
        <p class="text-gray-500 mt-4 uppercase tracking-widest text-[10px]">Zak Studio | Pro Architect Edition</p>
    </div>

    <div class="desktop-shell">
        <aside id="sidebar" class="side-dock">
            <div class="p-8 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-xl font-bold">RD</div>
                    <div><h2 class="font-bold text-white">Zak Studio</h2><p class="text-[10px] text-gray-500">System Architect</p></div>
                </div>
                <button onclick="toggleMobileSidebar()" class="lg:hidden text-gray-500"><i class="fa-solid fa-circle-chevron-left text-2xl"></i></button>
            </div>
            <div id="history-list" class="history-container"></div>
            <div class="p-6 border-t border-gray-800 space-y-3">
                <button onclick="toggleSettings(true)" class="w-full flex items-center justify-center gap-3 bg-[#1a1b1c] p-4 rounded-xl text-gray-400 hover:text-white transition border border-gray-800 text-sm">Settings</button>
            </div>
        </aside>

        <main class="editor-surface">
            <header class="p-6 flex items-center justify-between border-b border-gray-900">
                <div class="flex items-center gap-4">
                    <button onclick="toggleMobileSidebar()" class="lg:hidden p-2 text-gray-400"><i class="fa-solid fa-bars"></i></button>
                    <h1 class="text-xl font-medium" id="current-project-title">Workspace v17</h1>
                </div>
                <div id="status-chip" class="hidden px-4 py-1 rounded-full bg-blue-500/10 text-blue-500 text-xs font-bold border border-blue-500/20 uppercase tracking-tighter">Gemini Building<span class="loading-dots"></span></div>
            </header>

            <div class="flex-1 flex flex-col justify-center p-8">
                <div class="mega-input-container">
                    <div class="flex flex-wrap gap-2 mb-4" id="language-bar">
                        <button class="lang-btn active" onclick="setLang('HTML/CSS/JS', this)">Web</button>
                        <button class="lang-btn" onclick="setLang('Flutter', this)">Flutter</button>
                        <button class="lang-btn" onclick="setLang('Python', this)">Python</button>
                        <button class="lang-btn" onclick="setLang('C#', this)">C#</button>
                        <button class="lang-btn" onclick="setLang('Java', this)">Java</button>
                    </div>
                    <textarea id="main-input" placeholder="Describe your app... (e.g. A dark themed crypto dashboard)"></textarea>
                    <div class="flex flex-col md:flex-row justify-between items-center mt-6 gap-4">
                        <div class="flex gap-2">
                            <button id="mode-single" class="toggle-btn active" onclick="setMode('single')">Single File</button>
                            <button id="mode-multi" class="toggle-btn" onclick="setMode('multi')">Multi-File</button>
                        </div>
                        <div class="flex gap-4 items-center w-full md:w-auto">
                            <input type="text" id="project-name-input" class="bg-transparent border-b border-gray-800 outline-none text-sm flex-1 md:w-32" placeholder="Project Name">
                            <button onclick="launchBuild()" class="bg-white text-black px-8 py-3 rounded-2xl font-bold hover:bg-gray-200 transition">Build App</button>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="p-6 border-t border-gray-900 flex justify-between items-center text-[9px] text-gray-600 uppercase tracking-widest">
                <div>v17.0 Pro | Hybrid Engine</div>
                <div>Rai Daim Edition</div>
            </footer>
        </main>
    </div>

    <div id="render-view">
        <iframe id="build-frame" class="w-full h-full border-none"></iframe>
        <div class="preview-action-bar">
            <button onclick="closeBuild()" class="text-red-500 font-bold"><i class="fa-solid fa-xmark mr-2"></i>Exit</button>
            <button onclick="renderHybrid()" id="btn-preview" class="text-white border-l border-gray-800 pl-4 hidden"><i class="fa-solid fa-eye mr-2"></i>UI</button>
            <button onclick="viewOriginalCode()" class="text-blue-400 border-l border-gray-800 pl-4"><i class="fa-solid fa-code mr-2"></i>Code</button>
            <button onclick="copyBuild()" class="text-green-400 border-l border-gray-800 pl-4"><i class="fa-solid fa-copy mr-2"></i>Copy</button>
        </div>
    </div>

    <div id="config-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="text-3xl font-bold mb-2">System Config</h2>
            <div class="space-y-6 mt-8">
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase">Gemini API Key</label>
                    <input type="password" id="api-key-field" class="w-full bg-black border border-gray-800 p-4 rounded-xl mt-2 outline-none text-white focus:border-blue-500">
                </div>
                <button onclick="saveConfig()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">Save Changes</button>
                <button onclick="toggleSettings(false)" class="w-full text-gray-500 font-bold text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-dart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>

    <script>
        let currentBuildCode = "";
        let currentPreviewHtml = "";
        let selectedLang = "HTML/CSS/JS";
        let selectedMode = "single";
        let buildHistory = JSON.parse(localStorage.getItem('rd_history_v17')) || [];

        window.onload = () => {
            setTimeout(() => { document.getElementById('splash-screen').style.opacity = '0'; setTimeout(() => document.getElementById('splash-screen').style.display='none', 800); }, 1500);
            document.getElementById('api-key-field').value = localStorage.getItem('rd_api_key') || "";
            renderHistory();
        };

        function setLang(lang, el) {
            selectedLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function setMode(mode) {
            selectedMode = mode;
            document.getElementById('mode-single').classList.toggle('active', mode === 'single');
            document.getElementById('mode-multi').classList.toggle('active', mode === 'multi');
        }

        function toggleSettings(show) { document.getElementById('config-modal').style.display = show ? 'flex' : 'none'; }
        function toggleMobileSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function saveConfig() { localStorage.setItem('rd_api_key', document.getElementById('api-key-field').value.trim()); toggleSettings(false); }

        async function launchBuild() {
            const prompt = document.getElementById('main-input').value.trim();
            const key = localStorage.getItem('rd_api_key');
            if(!prompt || !key) return toggleSettings(true);
            
            document.getElementById('status-chip').classList.remove('hidden');
            
            const systemPrompt = `Expert Developer OS. Target: ${selectedLang}.
            Create a high-quality ${selectedLang} app for: ${prompt}.
            
            FORMAT RULES:
            1. Start with [SOURCE_CODE] then the real ${selectedLang} code.
            2. For non-web languages, follow with [PREVIEW_CODE] then an EQUIVALENT HTML/Tailwind mockup.
            3. No backticks. No talk. Just code sections.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
                });

                const data = await response.json();
                let fullText = data.candidates[0].content.parts[0].text;
                
                const sSplit = fullText.split('[SOURCE_CODE]');
                const pSplit = fullText.split('[PREVIEW_CODE]');

                currentBuildCode = (pSplit[0].split('[SOURCE_CODE]')[1] || fullText).trim().replace(/```[a-z]*|```/g, "");
                currentPreviewHtml = (pSplit[1] || "").trim().replace(/```html|```/g, "");

                document.getElementById('btn-preview').classList.toggle('hidden', selectedLang === 'HTML/CSS/JS');
                
                renderHybrid();
                
                const projName = document.getElementById('project-name-input').value || "Project_" + Date.now().toString().slice(-4);
                buildHistory.unshift({ name: projName, code: currentBuildCode, preview: currentPreviewHtml, lang: selectedLang, date: new Date().toLocaleDateString() });
                localStorage.setItem('rd_history_v17', JSON.stringify(buildHistory.slice(0, 15)));
                renderHistory();
            } catch (err) {
                alert("API Error. Check key or internet.");
            } finally { document.getElementById('status-chip').classList.add('hidden'); }
        }

        function renderHybrid() {
            const doc = document.getElementById('build-frame').contentDocument;
            doc.open();
            if(selectedLang === "HTML/CSS/JS") {
                doc.write(currentBuildCode);
            } else {
                doc.write(`
                    <div style="background:#1a73e8; color:white; padding:10px; text-align:center; font-family:sans-serif; font-size:11px; font-weight:bold; text-transform:uppercase;">Simulation Mode: ${selectedLang} UI</div>
                    ${currentPreviewHtml || '<div style="padding:40px; text-align:center; font-family:sans-serif;">Mockup generation failed. Switch to Code view.</div>'}
                `);
            }
            doc.close();
            document.getElementById('render-view').style.display = 'block';
        }

        function viewOriginalCode() {
            const doc = document.getElementById('build-frame').contentDocument;
            const langClass = selectedLang.toLowerCase().includes('python') ? 'python' : 
                             selectedLang.toLowerCase().includes('flutter') ? 'dart' : 'clike';
            
            doc.open();
            doc.write(`
                <html>
                <head>
                    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
                    <style>
                        body { background: #0d0d0d; color: #fff; margin: 0; padding: 20px; font-family: 'JetBrains Mono', monospace; }
                        .label { color: #555; font-size: 10px; font-weight: bold; margin-bottom: 10px; display: block; border-bottom: 1px solid #222; padding-bottom: 5px; }
                        pre { border-radius: 8px; font-size: 13px !important; }
                    </style>
                </head>
                <body>
                    <span class="label">SOURCE_FILE: ${selectedLang.toUpperCase()}</span>
                    <pre class="language-${langClass}"><code>${currentBuildCode.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>
                    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"><\/script>
                    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-dart.min.js"><\/script>
                    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"><\/script>
                </body>
                </html>
            `);
            doc.close();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = `<h3 class="text-[10px] font-bold text-gray-600 uppercase px-6 py-4">Recent Builds</h3>`;
            buildHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = "mx-4 flex justify-between items-center p-3 mb-2 bg-[#111] rounded-xl cursor-pointer hover:bg-[#1a1a1a] border border-transparent hover:border-blue-500/30 transition";
                div.innerHTML = `<div><div class="text-sm font-bold truncate w-32 text-gray-200">${item.name}</div><div class="text-[9px] text-blue-500 uppercase font-bold">${item.lang}</div></div><div class="text-[8px] text-gray-700">${item.date}</div>`;
                div.onclick = () => { 
                    currentBuildCode = item.code; 
                    currentPreviewHtml = item.preview; 
                    selectedLang = item.lang; 
                    renderHybrid(); 
                    if(window.innerWidth < 1024) toggleMobileSidebar(); 
                };
                list.appendChild(div);
            });
        }

        function closeBuild() { document.getElementById('render-view').style.display = 'none'; }
        function copyBuild() { navigator.clipboard.writeText(currentBuildCode); alert("Code copied to clipboard!"); }
    </script>
</body>
</html>
